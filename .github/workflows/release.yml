# Managi v3 Release: tag v* 触发的多平台构建与发布

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 同一 tag 的重复触发只留一个；发布中的流水线不取消，避免产物/Release 半途中断
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-go-binaries:
    name: Go Binaries (${{ matrix.artifact }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux glibc（Debian/Ubuntu）
          - goos: linux
            goarch: amd64
            artifact: managi-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: managi-linux-arm64
          # Linux musl（Alpine）— CGO_ENABLED=0 静态二进制，兼容 musl
          - goos: linux
            goarch: amd64
            artifact: managi-linux-amd64-musl
          - goos: linux
            goarch: arm64
            artifact: managi-linux-arm64-musl
          # macOS
          - goos: darwin
            goarch: amd64
            artifact: managi-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: managi-darwin-arm64
          # Windows
          - goos: windows
            goarch: amd64
            artifact: managi-windows-amd64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../artifacts
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -ldflags="-s -w" -o "../artifacts/${{ matrix.artifact }}${ext}" ./cmd/managi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/

  build-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  build-desktop:
    name: Windows Desktop Build
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
      - name: Copy embedded assets
        shell: bash
        run: |
          cp frontend/dist/index.html backend/internal/desktop/index.html
          cp desktop/icon.ico backend/internal/desktop/icon.ico
      # .syso 提供 exe 图标，必须落在 main 包目录（cmd/managi）
      - name: Generate Windows resource
        working-directory: backend/cmd/managi
        shell: bash
        run: |
          go run github.com/akavel/rsrc@latest -ico ../../internal/desktop/icon.ico -arch amd64 -o rsrc_windows_amd64.syso
      - name: Build desktop exe
        working-directory: backend
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p ../artifacts
          go build -tags desktop -ldflags="-H=windowsgui -s -w" \
            -o "../artifacts/managi-desktop-windows-amd64.exe" ./cmd/managi
      - uses: actions/upload-artifact@v4
        with:
          name: managi-desktop-windows-amd64
          path: artifacts/managi-desktop-windows-amd64.exe

  release:
    name: Publish Release
    needs: [build-go-binaries, build-frontend, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: List assets
        run: find release-assets -type f
      - name: Generate SHA256 sidecars
        # install.sh 的校验顺序是 MANAGI_SHA256 → Release 里的 <asset>.sha256 → 跳过。
        # 不发布 sidecar，用户侧永远只能落到「跳过校验」那条分支。
        # install.sh 自身不出 sidecar：脚本与它的 sidecar 同源，等于没多验出什么。
        run: |
          set -eu
          for f in release-assets/managi-*/* release-assets/frontend-dist/index.html; do
            [ -f "$f" ] || continue
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" > "$(basename "$f").sha256" )
          done
          find release-assets -name '*.sha256' -exec cat {} +
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/managi-*/*
            release-assets/frontend-dist/index.html*
            deploy/install.sh
