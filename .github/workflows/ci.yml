# Managi v3 CI: push/PR 触发的 lint + test + build 验证

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 同一分支的旧运行被新提交取代时直接取消，避免排队堆积重复构建
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-go:
    name: Go Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Go 版本以 backend/go.mod 为唯一来源，避免 bump go.mod 时漏改此处
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.6
          args: --timeout=3m
      - name: Go test (with race detector)
        run: go test -race ./...

  build-go:
    name: Go Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o /tmp/managi ./cmd/managi
      - name: Check binary size
        run: ls -lh /tmp/managi

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Verify single HTML
        run: ls -lh dist/index.html

  build-desktop:
    name: Windows Desktop Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run build
      - name: Copy embedded assets
        shell: bash
        run: |
          cp frontend/dist/index.html backend/internal/desktop/index.html
          cp desktop/icon.ico backend/internal/desktop/icon.ico
      # .syso 提供 exe 图标，必须落在 main 包目录（cmd/managi）
      - name: Generate Windows resource
        working-directory: backend/cmd/managi
        shell: bash
        run: |
          go run github.com/akavel/rsrc@latest -ico ../../internal/desktop/icon.ico -arch amd64 -o rsrc_windows_amd64.syso
      - name: Build desktop exe
        working-directory: backend
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -tags desktop -ldflags="-H=windowsgui -s -w" -o ../desktop/managi-desktop-windows-amd64.exe ./cmd/managi
      - name: Verify build artifact
        shell: bash
        run: ls -lh desktop/managi-desktop-windows-amd64.exe

  deploy-scripts:
    name: Deploy Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Syntax check
        run: sh -n deploy/install.sh && sh -n deploy/install_test.sh
      - name: Run install.sh checksum tests
        # 此前无人运行 install_test.sh，它的 wget 桩与 install.sh 的调用方式早已脱节却无人察觉
        run: sh deploy/install_test.sh

  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Trivy vulnerability scanner
        # 钉到具体 commit（v0.36.0）：@master 是浮动 ref，上游一改动本流水线就跟着变
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # 只在"有修复版本可用"时失败：上游暂无补丁的披露不应阻塞合并
          ignore-unfixed: true
